# Student Affairs CMS — MySQL 8 + Express app.
# The app runs migrations and seeds a working office on first boot, then
# serves everything under BASE_PATH (default /student-affairs).
#
#   docker compose up --build
#   Site:  http://localhost:5000/student-affairs/
#   Admin: http://localhost:5000/student-affairs/admin/login

services:
  db:
    image: mysql:8
    restart: unless-stopped
    # Pin binary-log expiry instead of inheriting MySQL's 30-day default.
    #
    # backup.sh archives closed binlogs and keeps BINLOG_KEEP_DAYS of them (20).
    # The live logs inside this volume are the source for those archives, so if
    # the server expires one before a daily backup has run, there is a hole in
    # the middle of the recovery window that no amount of archiving repairs. Keep
    # the server's own window comfortably longer than the archive window, and
    # loud about it: MySQL warns at startup if binlog_expire_logs_seconds is
    # longer than max_binlog_size, which is exactly the signal to look for here.
    command:
      - --binlog-expire-logs-seconds=2592000
      - --max-binlog-size=268435456
    environment:
      MYSQL_DATABASE: student_affairs
      MYSQL_USER: sa
      MYSQL_PASSWORD: ${DB_PASSWORD:-sa}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: UTC
    # Cap container logs. The default json-file driver has no size limit, so both
    # the app's stdout and the MySQL error log grow without bound on a single
    # 98 GB disk that also holds the database, the uploads and every backup.
    # 10 x 5 MB keeps roughly the last 50 MB per service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # mysqladmin ping validates the server is accepting connections.
      # CMD-SHELL so $MYSQL_PASSWORD expands inside the container; a hardcoded
      # password here fails as soon as DB_PASSWORD is changed in .env, and the
      # app (which waits on service_healthy) would never start.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -usa -p\"$$MYSQL_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    # Same log cap as the db service - see the comment there.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      BASE_PATH: /student-affairs
      # Upload ceilings. No per-type limits - one number governs every upload.
      # MAX_UPLOAD_BYTES is per file (0 = no per-file cap); UPLOADS_MAX_BYTES caps
      # the media library as a whole (0 = no cap). Both are overridable in .env.
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-4294967296}
      UPLOADS_MAX_BYTES: ${UPLOADS_MAX_BYTES:-21474836480}
      # Secrets are read from the git-ignored root `.env` (Compose reads it
      # automatically); the fallbacks are dev-only values.
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-please}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD:-sa}
      DB_NAME: student_affairs
      # Seed accounts on first boot — change these before deploying.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@niit.edu.pk}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      EDITOR_EMAIL: ${EDITOR_EMAIL:-editor@niit.edu.pk}
      EDITOR_PASSWORD: ${EDITOR_PASSWORD:-editor123}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      # Backups live on the host at /opt/student-affairs/backups and are produced
      # by ops/backup.sh from cron. Mounted READ-ONLY so the admin panel can list
      # and download them while the app can never write to or delete a backup.
      # Set BACKUPS_DIR to relocate it; it must be readable by the container's
      # uid (root in this image), so a host directory works as-is.
      - ${BACKUPS_DIR:-/opt/student-affairs/backups}:/backups:ro

volumes:
  db_data:
  uploads_data: