<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in — Office of Student Affairs, NIIT</title>
  <link rel="stylesheet" href="__BASE_PATH__/admin/css/admin.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="logo-mark">SA</span>
        <div>
          <b>Student Affairs CMS</b>
          <span>Office of Student Affairs</span>
        </div>
      </div>

      <h1>Sign in</h1>
      <p class="login-sub">Staff access only — NASTP Institute of Information Technology (NIIT).</p>

      <div class="form-error" id="login-error" hidden></div>

      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn block" id="login-btn">Sign in</button>
      </form>

      <p class="login-foot"><a href="__BASE_PATH__/">&larr; Back to the public site</a></p>
    </div>
  </main>

  <script src="__BASE_PATH__/config.js"></script>
  <script src="__BASE_PATH__/admin/js/auth.js"></script>
  <script src="__BASE_PATH__/admin/js/login.js"></script>
</body>
</html>
